decision: APPROVED_FOR_PUBLICATION
approved_claims:
- Three-outcome decision behaviour of s_C under the primary policy at the displayed coverage target, over the held-out topologies
  where that target is attainable (named above the panels; Center is excluded at 0.60 because its maximum attainable coverage
  is 0.258). (a) Shares and counts of SPECIFIC, AMBIGUITY_SET and UNRESOLVED decisions per true class, with windows, runs
  and independence groups (family or scenario-replica links). (b) Correctness of issued SPECIFIC decisions and inclusion of
  the true class in issued ambiguity sets, as k/n; undefined where no such decision exists; neither is classifier accuracy.
  (c) Primary reason for non-SPECIFIC decisions, assigned by a documented precedence rule (support-flag block before matched-coverage
  cut before set construction); contributing, non-exclusive reasons are tabulated in T6c. (d) Rates of D(x) support flags
  over the same windows; flags overlap, and flag-free windows are not necessarily correct.
limitations_acknowledged:
- 'Evaluated population excludes topologies where the target is unattainable (named in the figure). Independent support is
  thin: NORMAL, C-DELAY and C-FAULT rest on ONE independence group each (forensic FA-03). Topology attribution of 36 event
  runs is disputed (L12 / R-18). Correctness of SPECIFIC decisions is not classifier accuracy; inclusion is not specific accuracy;
  flag-free is not correct.'
