approved_claims:
- 'Data support and evaluation design. (a) Eligible simulation runs per class in each simulated topology (label: runs/families);
  thin classes have one independent family per topology. (b) Eligible 60 s windows per class (log scale; share of all windows);
  windows overlap within runs and are not independent observations. (c) Start-time range, interquartile range and median of
  eligible windows: COMPRESSOR_DELAY occurs only in the start-up segment and is therefore confounded with operating phase.
  (d) Leave-one-topology-out evaluation: every model-development step uses the two training topologies only.'
limitations_acknowledged:
- three simulated topologies; 1 NORMAL, 1 DELAY and 1 FAULT family per topology (one independence group each across topologies);
  windows overlap and are not independent; DELAY windows only in the start-up segment; topology labels follow the release
  folders, whose Center/Downstream event attribution is disputed by the source simulation models (L12 / R-18, decision pending)
