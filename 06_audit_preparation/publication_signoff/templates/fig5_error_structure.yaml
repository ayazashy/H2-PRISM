approved_claims:
- Error structure of the underlying Random Forest on held-out topologies. (a) Confusion matrix of the calibrated top label,
  pooled over the three held-out topologies (row shares and window counts); 7,972 of the 8,012 errors (Center LEAK to NORMAL,
  Downstream NORMAL to LEAK or FAULT) follow the disputed Center/Downstream topology attribution of the release (L12 / R-18).
  (b) Window-level precision, recall and F1 per class with the runs and topology-scoped families behind each class; families
  are not independent across topologies (NORMAL, C-DELAY and C-FAULT each rest on one scenario independence group). (c) Top-label
  reliability; development-only calibration selected 'none' in every fold, so the two curves coincide. These panels describe
  the classifier, not the selective H$_2$-PRISM decision.
limitations_acknowledged:
- classifier output, not the selective decision; window-level scores overstate independent evidence; thin classes descriptive;
  pooled over topologies whose release attribution is disputed (L12 / R-18)
