   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Times New Roman', serif; fill: #20252b" transform="translate(154.024437 151.60342)">12 captures re-verified;</text>
    <text style="font-size: 9.5px; font-family: 'Times New Roman', serif; fill: #20252b" transform="translate(178.411977 161.551404)">13 sensors</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Times New Roman', serif; fill: #20252b" transform="translate(280.173211 151.60342)">27,993 windows; 36/57 runs</text>
    <text style="font-size: 9.5px; font-family: 'Times New Roman', serif; fill: #20252b" transform="translate(297.199734 161.551404)">attribution disputed</text>
   </g>
   <g id="text_8">
