    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', serif; fill: #087e8b" transform="translate(445.579875 84.152695)">compressor</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', serif; fill: #ba8a28" transform="translate(586.417437 63.766445)">HY2RES</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', serif; fill: #ba8a28" transform="translate(560.258062 74.039257)">operational hydrogen</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', serif; fill: #ba8a28" transform="translate(591.702594 84.14332)">system</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Times New Roman', serif; fill: #20252b" transform="translate(48.555047 146.04924)">Layer I</text>
