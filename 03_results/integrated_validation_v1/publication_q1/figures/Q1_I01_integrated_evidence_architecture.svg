   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', serif; fill: #17324d" transform="translate(183.621156 63.77582)">Center</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', serif; fill: #17324d" transform="translate(153.007094 73.861132)">controlled simulation</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', serif; fill: #17324d" transform="translate(157.14225 84.133945)">(air-like gas model)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', serif; fill: #3b6f9c" transform="translate(300.388406 63.672695)">H2-SimNet / R2</text>
