<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SAIF 2026 · Check & Map</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82f6'/><polygon fill='white' points='16,6 19,12.5 26,13.5 21,18.5 22.2,25.5 16,22.2 9.8,25.5 11,18.5 6,13.5 13,12.5'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="top-row-1">
        <span class="brand-pill">SAIF 2026</span>
        <div class="search-wrap">
          <span class="search-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
          <input id="search-input" class="search-input" type="search" autocomplete="off" />
          <button id="search-clear" class="search-clear hidden" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="top-actions">
          <button id="btn-filters" class="icon-pill" data-top-act="filters" type="button"></button>
          <button id="btn-prefs" class="icon-pill" data-top-act="prefs" type="button"></button>
          <div class="view-seg">
            <button data-view="split" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
            <button data-view="list" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
            <button data-view="map" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><path d="M9 3v15M15 6v15"/></svg></button>
          </div>
          <button id="btn-lang" class="icon-pill" data-top-act="lang" type="button"></button>
          <button id="btn-theme" class="icon-pill" data-top-act="theme" type="button"></button>
          <button id="btn-help" class="icon-pill" data-top-act="help" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
          <button id="btn-backup" class="icon-pill" data-top-act="backup" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
        </div>
      </div>

      <div class="top-row-2" id="status-tabs"></div>
    </header>

    <div id="active-bar" class="active-bar">
      <div id="active-chips" class="active-chips"></div>
      <div class="active-end">
        <select id="sort-select" class="sort-select"></select>
        <div id="bulk-group" class="bulk-group"></div>
      </div>
    </div>

    <main id="workspace" class="workspace mode-split">
      <section id="list-pane" class="list-pane"></section>
      <section id="map-pane" class="map-pane"></section>
    </main>

    <div id="modal-overlay" class="overlay hidden">
      <div id="modal-body" class="modal"></div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
